name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish
        run: dotnet publish M3UPlaylistHelper/M3UPlaylistHelper.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: M3UPlaylistHelper-win-x64
          path: publish
