name: Release

# Publish a GitHub release, either way:
# - Actions > Release > Run workflow, enter a version (e.g. 1.2.1); the tag v1.2.1 is created on the chosen branch
# - or push a version tag: git tag v1.2.1 && git push origin v1.2.1
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.2.1 (creates the tag v1.2.1)'
        required: true
      notes:
        description: 'Release notes (optional, shown above the generated changelog)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Inputs go through env, never straight into scripts
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test --configuration Release

      - name: Check version
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Version must look like 1.2.3, got '$env:TAG'" }
          "VERSION=$($env:TAG.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Publish
        shell: pwsh
        run: |
          $version = $env:VERSION
          $common = @('M3UPlaylistHelper/M3UPlaylistHelper.csproj', '--configuration', 'Release', '--runtime', 'win-x64',
                      '-p:PublishSingleFile=true', '-p:DebugType=none', "-p:Version=$version")

          # Runs anywhere, no .NET installation needed
          dotnet publish @common --self-contained true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --output out/standalone

          # Small download for machines that already have the .NET 8 Desktop Runtime
          dotnet publish @common --self-contained false --output out/framework

          New-Item -ItemType Directory -Force dist, out/portable | Out-Null
          Copy-Item out/standalone/M3UPlaylistHelper.exe "dist/M3UPlaylistHelper-$version-win-x64.exe"
          Copy-Item out/framework/M3UPlaylistHelper.exe "dist/M3UPlaylistHelper-$version-win-x64-requires-dotnet8.exe"

          # Portable: settings are stored next to the exe instead of %AppData%
          Copy-Item out/standalone/M3UPlaylistHelper.exe out/portable/
          Set-Content out/portable/portable.txt "Settings are stored in settings.json next to M3UPlaylistHelper.exe. Delete this file to use %AppData% instead."
          Compress-Archive -Path out/portable/* -DestinationPath "dist/M3UPlaylistHelper-$version-win-x64-portable.zip"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # When started from the Actions tab, the tag doesn't exist yet and is created on this commit
          target_commitish: ${{ github.sha }}
          name: M3U Playlist Helper ${{ env.VERSION }}
          body: ${{ inputs.notes }}
          files: dist/*
          generate_release_notes: true
